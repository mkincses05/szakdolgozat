name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway database for the backend integration tests; the password exists only for this job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wildhand_admin
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: wildhand_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildhand_admin -d wildhand_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # The backend and the frontend use the built shared package (`file:../shared`), so shared goes first.
      - name: Shared - install
        working-directory: shared
        run: npm ci

      - name: Shared - typecheck
        working-directory: shared
        run: npm run typecheck

      - name: Shared - test
        working-directory: shared
        run: npm test

      - name: Shared - build
        working-directory: shared
        run: npm run build

      - name: Backend - install
        working-directory: backend
        run: npm ci

      - name: Backend - typecheck
        working-directory: backend
        run: |
          npm run typecheck
          npx tsc -p tools/simulate/tsconfig.json

      - name: Backend - test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://wildhand_admin:ci-only@localhost:5432/wildhand_test
        run: npm test

      - name: Backend - build
        working-directory: backend
        run: npm run build

      - name: Frontend - install
        working-directory: frontend
        run: npm ci

      - name: Frontend - typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend - test
        working-directory: frontend
        run: npm test

      - name: Frontend - build
        working-directory: frontend
        run: npx vite build
